# Dev-tiny model config — NOT a training target.
# A chopped-down variant of the v2.0 §3.1 default purely for fast unit tests
# on the local RTX 4090 (24 GB). It exercises the same machinery — SWA/GLOBAL/
# GATHER dispatch, sink logits, p-RoPE partial rotary, Block AttnRes with
# multi-block delta-sum sources — at toy scale, so invariants and step-0
# sanity can be tested in seconds without loading the 8B donor. Donor-scale
# step-0 sanity (spec §3.8) runs on the deploy box. See AGENTS.md "Hardware".
vocab_size: 1024
hidden_size: 256
num_hidden_layers: 9
layer_types:
  - swa
  - swa
  - swa
  - global
  - swa
  - swa
  - swa
  - global
  - gather
num_attention_heads: 8
num_key_value_heads: 4
head_dim: 32
intermediate_size: 512
rms_norm_eps: 1.0e-05
tie_word_embeddings: false

swa:
  window: 32                # toy-sized so offset-invariant tests are meaningful
  rope_theta: 10000.0       # bare final theta (spec §3.2)
  sink:
    type: learned_logit
    init: -10.0

global:
  rope_type: prope
  rope_fraction: 0.25       # 8 of 32 head dims rotated
  rope_theta: 1000000.0
  qk_norm: false

gather:
  rope_type: prope
  rope_fraction: 0.25
  rope_theta: 1000000.0
  qk_norm: false
  init: identity_from_layer_31  # for the tiny model: "copy final block's global layer"
  position: 8

attn_res:
  enabled: true
  scope: all_layers
  sources: embedding_plus_block_delta_sums_plus_partial
  keys: rmsnorm
  values: raw
  pseudo_query_init: zeros
  gate: false

engram:
  enabled: false            # module landed; enable per run config. Rows live in
                          # host RAM with prefetch; readout params on-device.
  orders: [1, 2, 3]
  heads_per_order: 2
  row_dim: 64               # toy-sized
  rows_per_head: { 2: [4093, 4091], 3: [4079, 4073] }  # annex A1.4: distinct
                          # primes per (order, head); order 1 derived (smallest
                          # prime >= vocab 1024 -> 1031)
  injection_point: 3
  canonical_compression: false  # toy vocab has no tokenizer artifact (annex A1.2 fallback)
  lr_mult: 5.0              # annex A1.7: rows LR x5, WD 0
