# Bring-up bf16 reference smoke (first-steps §3.4, spec §4) — deploy box only.
# Short run at bf16, FINAL topology, Engram on: records the reference loss
# curve + tokens/sec. The checkpoint is DISCARDED after the run — the FP8
# overlay run (spec §4 bring-up protocol) is judged against this curve.
# Do not edit mid-flight; interrupt via --max_steps at a checkpoint boundary.
model: train/configs/model/llama_9b_engram_v1.yaml
data_shards: []            # fill with converted shard dirs (train/data/shards/...)
seq_len: 8192              # production shape — the smoke must represent it
shuffle: true
data_seed: 0

steps: 200                 # advisory (spec §0.1); enough for a curve + tok/s
batch_size: 1
grad_accum: 1             # 4 does NOT fit the 96 GB box: micro-batch N+1's
                          # forward runs with ~31 GiB of accumulated fp32 grads
                          # resident (bring-up OOM #4, 2026-09-03) — 1 is the
                          # only value that fits. Effective batch 8192 tok/step.
lr: 2.0e-4
min_lr_ratio: 0.1
warmup_steps: 20
weight_decay: 0.1
grad_clip: 1.0

alpha: 1.0                 # bulk shards are fold_version v2 (unfolded)
temperature: 1.0
loss_chunk_size: 512

bf16: true                 # the reference numerics path
# torch_compile: true      # optional perf knob (static 8k shape, one graph);
                           # keep OFF for the smokes (one variable at a time),
                           # flip for the real run after the FP8 overlay passes
optimizer: adamw8bit       # spec §5.1 locked default (fp32 AdamW does not fit 96 GB)
grad_checkpointing: true   # per-sublayer (spec §4 activation budget)
seed: 0
init: warm                 # donor furniture init (spec §3.4)
donor_path: OriginalModel

out_dir: train/runs/bringup_bf16_smoke
checkpoint_every: 100
log_every: 5
