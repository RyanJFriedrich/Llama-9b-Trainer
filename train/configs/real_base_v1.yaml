# REAL RUN: base-v1 (owner plan 2026-09-02) — deploy box only.
# Launch ONLY after the FP8 overlay smoke is accepted (runbook Part 4c).
# 5 epochs over the current class-(a) corpus: 81 NPZ = 83.5M tokens
# (manifest 2026-09-01) -> 2547 steps/epoch at 32768 tok/step (grad_accum 4,
# reopened by bf16 grad accumulation — owner decision 2026-09-03) -> 12735
# steps. Embeddings/lm_head frozen (same decision: freeze_embeddings default).
# The artifact is the inspectable "base v1": FP8 standard path + compiled
# forward, donor furniture init via the prebuilt HF base checkpoint.
# Do not edit mid-flight; interrupt via checkpoint boundaries. Data top-up
# pattern: convert the new NPZs, COPY this config (real_base_v2.yaml) with the
# grown shard list, and --resume from the latest checkpoint — a new config is
# a new flight, the resume carries the state.
model: train/configs/model/llama_9b_engram_v1.yaml
data_shards: []            # fill: python -m train.scripts.fill_smoke_shards --configs <this file>
seq_len: 8192
shuffle: true
data_seed: 0

steps: 12735               # 5 epochs over 83.5M tokens (advisory, spec §0.1)
batch_size: 1
grad_accum: 4              # bf16 grad buffers make this fit; 32768 tok/step
lr: 2.0e-4                 # unchanged from the accepted smoke — one variable
min_lr_ratio: 0.1          # at a time
warmup_steps: 20
cosine_steps: 200         # anneal over 200 steps, then steady state at the
                           # 200 steps found to work in testing.
weight_decay: 0.1
grad_clip: 1.0

alpha: 1.0                 # bulk shards are fold_version v2 (unfolded)
temperature: 1.0
loss_chunk_size: 512

bf16: true
precision: fp8             # standard path, post-overlay-acceptance
torch_compile: true        # one static graph (fixed [1, 8192]); first step
                           # compiles for a few minutes — that is normal
optimizer: adamw8bit
grad_checkpointing: true
seed: 0
init: prebuilt             # the HF base checkpoint round-trip
prebuilt_path: exports/llama-9b-base-v1

out_dir: train/runs/real_base_v1
checkpoint_every: 100     # one drop per epoch: 5 drops over the run, ~50 GB
                           # each = ~250 GB. PRUNE after pulling a checkpoint
                           # down (keep the latest 1-2) — the trainer never
                           # deletes.
log_every: 5
