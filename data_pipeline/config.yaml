# Llama-8B++ Phase-1 class-(b) data pipeline configuration.
# Copy this file, fill in the owner-provided secrets, and pass it to each stage.

# ---------------------------------------------------------------------------
# Stage 1: Interrogation loop (Gemma student ↔ 70B teacher API)
# ---------------------------------------------------------------------------
interrogate:
  # Student (Gemma) endpoint. Use either an OpenAI-compatible base URL or a
  # local GGUF path that we will serve with LlamaCPPBinaries/llama-server.exe.
  student:
    # Provider types:
    #   "openai"      -> /v1/chat/completions (LM Studio, vLLM, OpenAI, etc.)
    #   "native_chat" -> custom /api/v1/chat endpoint (some LM Studio/Gemma setups)
    provider: native_chat
    base_url: "http://localhost:1234"
    api_path: "api/v1/chat"                # only used for native_chat
    api_key: "lm-studio"                   # or env var ${STUDENT_API_KEY}
    model: "gemma-4-31b-it-abliterated@iq3_s"
    temperature: 0.9
    # top_p / max_tokens are passed only for the openai provider.
    top_p: 0.95
    max_tokens: 128

  # Teacher (Llama-3.3-70B-Instruct API). Owner provides D-p1.
  teacher:
    provider: openai
    # Example: Poe API (max_tokens must be <= 12288 for this model).
    base_url: "https://api.poe.com/v1"
    api_key: "${POE_API_KEY}"
    model: "Llama-3.3-70B-N"
    temperature: 0.7
    max_tokens: 1024
    top_p: null

  # Seed subject list (D-p2). One JSON object per line; each object must have
  # at least a "question" field. Optionally also seed_id, topic, subtopic.
  seeds: "data_pipeline/seeds.jsonl"

  # Output raw conversations. This is the resume point for stages 3–4.
  output_dir: "data_pipeline/raw"

  # Conversation controls
  max_conversations: 1000
  min_turns: 2
  max_turns: 6            # hard cap on follow-up turns
  max_total_tokens: 3500  # stop if formatted conversation exceeds this
  sleep_seconds: 0.5
  seed: 42

  # Anti-collapse guards
  dedup:
    method: ngram_overlap   # "ngram_overlap" | "embedding"
    ngram_size: 8
    overlap_threshold: 0.6  # fraction of n-grams in common
  loop_detection:
    enabled: true
    overlap_threshold: 0.7  # consecutive assistant answers
  length_floor:
    enabled: true
    min_assistant_chars: 300

# ---------------------------------------------------------------------------
# Stage 3: Format & mask (Llama-3.1 chat template)
# ---------------------------------------------------------------------------
format:
  # Raw JSONL from Stage 1
  input: "data_pipeline/raw/conversations.jsonl"
  # Formatted output (one JSON object per conversation)
  output: "data_pipeline/formatted/formatted.jsonl"
  # Llama-3.1 tokenizer checkpoint (D2 donor)
  tokenizer: "OriginalModel"
  # Loss mask: 1 on assistant content tokens, 0 on user/system + scaffolding
  mask_assistant_only: true

# ---------------------------------------------------------------------------
# Stage 4: Anchor scoring (local quantized 8B donor)
# ---------------------------------------------------------------------------
score:
  # Input from Stage 3
  input: "data_pipeline/formatted/formatted.jsonl"
  # Output spec §6.2 shard directory
  shard_dir: "data_pipeline/shards/class_b_v1"
  # Scoring backend.
  #   "llama_server" uses LlamaCPPBinaries/llama-server.exe + Q8 GGUF (fastest).
  #   "pytorch" uses OriginalModel via train/src/tools/load_donor (fallback if
  #   the server binary does not return prompt logprobs).
  backend: "pytorch"
  k: 10

  # --- llama_server settings ---
  gguf: "QuantizedModel/meta-llama-3.1-8b-instruct.Q8_0.gguf"
  server_exe: "LlamaCPPBinaries/llama-server.exe"
  ctx_size: 8192
  batch_size: 2048
  ubatch_size: 512
  gpu_layers: 999        # -1 = auto; 999 = all layers
  kv_type: bf16          # bf16 | f16 | q8_0
  flash_attn: true
  kill_existing_server: false   # true: terminate orphan llama-server.exe processes
  attach_port: null      # attach to existing server (debugging)

  # --- pytorch settings ---
  donor: "OriginalModel"  # HF checkpoint path
  device: "cuda"
  dtype: "bf16"           # bf16 | fp16

# ---------------------------------------------------------------------------
# Pipeline metadata (written into every shard sidecar)
# ---------------------------------------------------------------------------
metadata:
  # Text generator provenance — updated automatically from conversation meta.
  # Override here if you want a fixed string in the sidecar.
  text_source: null
  logit_source: "llama-3.1-8b-instruct.Q8_0"
  fold_version: "v2"
  data_class: "b"
  anchor_gamma_recommended: 0.1

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
log_file: "data_pipeline/common.log"
